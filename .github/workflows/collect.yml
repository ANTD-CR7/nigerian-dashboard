name: Collect source data

# Automated data collection. Runs daily (and on demand) -- several CBN
# connectors publish daily (interbank rates, exchange rates, NFEM), so a
# weekly cadence left them up to 6 days stale before this was changed from
# weekly to daily. CBN doesn't publish on weekends, so those days are
# harmless no-ops. By default this only produces a reviewable JSON snapshot
# artifact -- it does NOT write to the database. To let it upsert into
# Supabase, set the repo secrets (SUPABASE_URL, SUPABASE_SERVICE_KEY -- the
# service-role key, never the anon key; see project/database/setup.sql's
# LOCKDOWN section, audit finding #1/#107) and flip NPE_COLLECT_WRITE to
# "true".

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run collectors (demo-safe snapshot)
        env:
          NPE_COLLECT_WRITE: ${{ vars.NPE_COLLECT_WRITE }}   # "true" to write
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          pip install supabase openpyxl pdfplumber >/dev/null 2>&1 || true
          python -m collectors.runner ${{ vars.NPE_COLLECT_WRITE == 'true' && '--write' || '' }}
      - name: Upload snapshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collected-data
          path: data/collected/*.json
          if-no-files-found: warn
